[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timesplit-affinity-benchmark"
version = "0.1.0"
description = "Time-split, novelty-filtered benchmark for protein-ligand binding affinity prediction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "psycopg2-binary",
    "pyyaml",
    "rdkit>=2025.09.6",
    "tqdm>=4.0",
]

[project.optional-dependencies]
model = [
    "torch>=2.0,<2.6",
    "lightning>=2.0",
    "jsonargparse[signatures]>=4.27.7",
    "biopython>=1.80",
    "scipy",
    "matplotlib",
    "notebook",
]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/timesplit_affinity_benchmark",
    "src/bind_pred_baseline",
]

[tool.ruff.lint]
ignore = ["E712"]

[tool.pytest.ini_options]
testpaths = ["tests"]
