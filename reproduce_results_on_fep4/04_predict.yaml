# Prediction config.
# Run with:
#   uv run python -m bind_pred_baseline.train predict \
#     --config out_baseline/lightning_logs/version_X/config.yaml \
#     --ckpt_path out_baseline/lightning_logs/version_X/checkpoints/<best-checkpoint>.ckpt \
#     --config reproduce_results_on_fep4/04_predict.yaml

trainer:
  accelerator: auto
  devices: 1
  default_root_dir: out_baseline/preds/
  callbacks:
    - class_path: bind_pred_baseline.model_utils.PredictWriterCallback
      init_args:
        output_csv: predictions.csv

data:
  data_dir: out_baseline/data_preprocessing_FEP4_split  # This is the directory to the preprocessing folder for the models training data
  predict_input_csv: ../paper_data_leakage_FEPp_benchmark/data/out/FEPp_benchmark.csv  # Should contain: ligand_name, uniprot_id, smiles
  predict_standard_type: IC50  # We can use IC50 as the model output only differ by a constant between IC50/Ki/Kd