chembl_requester:
  host:  # e.g. localhost
  user:  # your PostgreSQL username
  password:  # your PostgreSQL password
  dbname:  # e.g. chembl_36

pipeline:
  tanimoto_threshold: 0.35  # does not matter when reproducing the FEP+ 4 results
  keep_not_novel_in_test: true  # Needs to be set to true when reproducing the FEP+ 4 results
  n_jobs: -1   # parallel workers for fingerprint and compounds similarity computation: -1 -> use all cores
  activity_limit: null
