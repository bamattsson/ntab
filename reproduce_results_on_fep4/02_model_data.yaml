# Preprocessing config for the affinity baseline — FEP benchmark data split.
# Run: uv run python -m bind_pred_baseline.preprocess_training_data --config reproduce_results_on_fep4/02_model_data.yaml

paths:
  activities_parquet: ../timesplit-affinity-benchmark/out_FEP4/activities.parquet
  targets_parquet: ../timesplit-affinity-benchmark/out_FEP4/targets.parquet
  output_dir: out_FEP4_baseline/data_preprocessing
fp_type: count
# This should contain the FEP+ 4 data split as uniprot_id -> train/val/test
split_from_file: ../paper_data_leakage_FEPp_benchmark/data/out/FEP_data_split.csv
val_splits:
  - val  # Needs to be val for this dataset
n_jobs: 8
oov_min_train_datapoints: 100
