# Preprocessing config for the affinity baseline — FEP benchmark data split.
# Run: uv run python -m bind_pred_baseline.preprocess_training_data --config configs_FEP_split/data.yaml

paths:
  activities_parquet: ../timesplit-affinity-benchmark/out/activities.parquet
  targets_parquet: ../timesplit-affinity-benchmark/out/targets.parquet
  compounds_parquet: ../timesplit-affinity-benchmark/intermediate_out/compounds_raw.parquet
  output_dir: out/data_preprocessing_FEP_split

# Fingerprint type: "binary" (0/1 bits) or "count" (substructure occurrence counts).
fp_type: count

# Path to a CSV with columns [uniprot_id, data_split] that overrides the split
# column in activities.parquet. Rows whose uniprot_id is not present in this
# file are dropped. Set to null to use the split column from activities.parquet.
split_from_file: ../paper_data_leakage_FEPp_benchmark/data/out/FEP_data_split.csv

# Which val split label to include during training validation.
# When split_from_file is used, the CSV uses plain "val" (not val_novel/val_not_novel).
val_splits:
  - val

# Number of parallel worker processes for fingerprint generation and OOV target alignment.
# -1 uses all available CPUs.
n_jobs: 8

# Minimum number of training datapoints a target must have to be eligible
# as an OOV mapping destination. Set to 0 to disable filtering.
oov_min_train_datapoints: 100
