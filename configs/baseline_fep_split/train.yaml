# Training config.
# Run with:
#   uv run python -m bind_pred_baseline.train fit --config configs/train.yaml

seed_everything: 42

trainer:
  max_epochs: 25
  accelerator: auto
  devices: 1
  log_every_n_steps: 50
  default_root_dir: out
  callbacks:
    - class_path: bind_pred_baseline.model_utils.MetricsPlotCallback
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_pearson_r
        mode: max
        save_top_k: 1
        filename: best-{epoch}-{val_pearson_r:.4f}

data:
  data_dir: out/data_preprocessing_FEP_split
  num_workers: 4

model:
  use_fps: true
  use_mol_props: true
