chembl_requester:
  host:      # e.g. localhost
  user:      # your PostgreSQL username
  password:  # your PostgreSQL password
  dbname:    # e.g. chembl_36

# Root output directory. Final outputs go here
out_dir: out

pipeline:
  tanimoto_threshold: 0.35  # compounds with max Tanimoto similarity >= this are excluded from val/test; null disables the filter

  # Year boundaries for the time split.
  # - doc_year < year_val_start                              → train
  # - year_val_start <= doc_year < year_test_start          → val (split by compound novelty)
  # - doc_year >= year_test_start                           → test (novel cpds) or discard (not novel)
  year_val_start: 2022
  year_test_start: 2023

  # Set to true to retain "discard_not_novel" rows (test-year compounds that are
  # not novel — either due to the Tanimoto filter or because they first appeared
  # before the cutoff year) in the output.
  keep_discard_not_novel: false

  n_jobs: -1   # parallel workers for fingerprint and compounds similarity computation: -1 -> use all cores
  activity_limit: null  # set to an integer (e.g. 10000) for a smaller test run; null = full dataset
  filter_val_and_test_sets:  # Disable by setting to null/false
    apply_to: ["test", "val_novel", "val_not_novel"]  # which splits you want to apply this filter to
    only_equal_relation: true  # Whether to only keep pchembl_relation of `=`
    min_std: 0.5  # Assays with fewer than this standard deviation are removed
    min_cpd_per_assay: 10  # Assays with fewer than this number of compounds are removed
    one_assay_per_doc: true  # Whether to only keep one assay per ChEMBL document
